<div class="relative inline-block select-none">
  <!-- Trigger Button -->
  <button 
    (click)="toggleDropdown($event)"
    [class]="'flex items-center justify-center w-9 h-9 rounded-full border border-white/10 hover:bg-white/10 hover:text-jeopardy-gold transition-all duration-300 shadow-md outline-none focus:ring-1 focus:ring-jeopardy-gold/50 cursor-pointer ' + (isOpen() ? 'bg-white/10 text-jeopardy-gold' : 'bg-white/5 text-white')"
    [title]="'Audio- und Stimmeinstellungen'">
    @if (muted() || volume() === 0) {
      <svg class="w-4 h-4 text-white/50" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" d="M17.25 9.75L19.5 12m0 0l2.25 2.25M19.5 12l2.25-2.25M19.5 12l-2.25 2.25m-10.5-6L4.5 9H1.5v6h3l4.5 3.75V5.25z"></path>
      </svg>
    } @else if (volume() < 0.4) {
      <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" d="M19.114 5.636a9 9 0 010 12.728M16.463 8.288a5.25 5.25 0 010 7.424M6.75 8.25l4.72-4.72a.75.75 0 011.28.53v15.88a.75.75 0 01-1.28.53l-4.72-4.72H4.51c-.88 0-1.704-.507-1.938-1.354A9.01 9.01 0 012.25 12c0-.83.112-1.633.322-2.396C2.806 8.756 3.63 8.25 4.51 8.25H6.75z"></path>
      </svg>
    } @else {
      <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" d="M19.114 5.636a9 9 0 010 12.728M16.463 8.288a5.25 5.25 0 010 7.424M6.75 8.25l4.72-4.72a.75.75 0 011.28.53v15.88a.75.75 0 01-1.28.53l-4.72-4.72H4.51c-.88 0-1.704-.507-1.938-1.354A9.01 9.01 0 012.25 12c0-.83.112-1.633.322-2.396C2.806 8.756 3.63 8.25 4.51 8.25H6.75z"></path>
        <path stroke-linecap="round" stroke-linejoin="round" d="M21.5 12a12.5 12.5 0 01-2.386 7.386M21.5 12a12.5 12.5 0 00-2.386-7.386"></path>
      </svg>
    }
  </button>

  <!-- Dropdown Panel -->
  @if (isOpen()) {
    <div class="absolute right-0 mt-2.5 w-72 bg-black/90 border border-white/15 rounded-2xl p-4 shadow-2xl backdrop-blur-xl z-50 flex flex-col gap-4 audio-settings-popover">
      
      <!-- Popover Header -->
      <div class="flex items-center justify-between pb-2 border-b border-white/10">
        <span class="text-xs font-black uppercase tracking-wider text-white font-sans">Audio & Stimme</span>
        <svg class="w-3.5 h-3.5 text-jeopardy-gold animate-pulse" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 6V4m0 2a2 2 0 100 4m0-4a2 2 0 110 4m-6 8a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4m6 6v10m6-2a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4"></path>
        </svg>
      </div>

      <!-- Master Volume Slider Section -->
      <div class="flex flex-col gap-2">
        <div class="flex items-center justify-between text-[11px] font-bold text-white/50 uppercase tracking-wide font-sans">
          <span>Gesamtlautstärke</span>
          <span>{{ muted() ? 'Stumm' : (volume() * 100 | number:'1.0-0') + '%' }}</span>
        </div>
        
        <div class="flex items-center gap-3 bg-white/[0.03] border border-white/5 rounded-xl p-2.5">
          <!-- Mute/Unmute Icon Button -->
          <button 
            (click)="toggleMute($event)"
            class="text-white hover:text-jeopardy-gold transition-colors p-1 cursor-pointer flex items-center justify-center rounded-full outline-none"
            [title]="muted() ? 'Ton einschalten' : 'Stummschalten'">
            @if (muted() || volume() === 0) {
              <svg class="w-4 h-4 text-white/50" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M17.25 9.75L19.5 12m0 0l2.25 2.25M19.5 12l2.25-2.25M19.5 12l-2.25 2.25m-10.5-6L4.5 9H1.5v6h3l4.5 3.75V5.25z"></path>
              </svg>
            } @else {
              <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M19.114 5.636a9 9 0 010 12.728M16.463 8.288a5.25 5.25 0 010 7.424M6.75 8.25l4.72-4.72a.75.75 0 011.28.53v15.88a.75.75 0 01-1.28.53l-4.72-4.72H4.51c-.88 0-1.704-.507-1.938-1.354A9.01 9.01 0 012.25 12c0-.83.112-1.633.322-2.396C2.806 8.756 3.63 8.25 4.51 8.25H6.75z"></path>
              </svg>
            }
          </button>

          <!-- Range Slider -->
          <div class="flex-1 flex items-center">
            @let activeVol = muted() ? 0 : volume();
            <input 
              type="range" 
              min="0" 
              max="1" 
              step="0.05"
              [value]="volume()"
              (input)="onVolumeChange($event)"
              class="volume-slider"
              [class.muted]="muted()"
              [style.background]="'linear-gradient(to right, #f1b814 0%, #f1b814 ' + (activeVol * 100) + '%, rgba(255, 255, 255, 0.15) ' + (activeVol * 100) + '%, rgba(255, 255, 255, 0.15) 100%)'"
              title="Lautstärke">
          </div>
        </div>
      </div>

      <!-- Voice (Text-to-Speech) Settings Section -->
      <div class="flex flex-col gap-2">
        <span class="text-[11px] font-bold text-white/50 uppercase tracking-wide font-sans">Sprach-Optionen</span>
        
        <div class="flex flex-col gap-3 bg-white/[0.03] border border-white/5 rounded-xl p-3">
          <!-- Toggle Row -->
          <div class="flex items-center justify-between gap-3">
            <div class="flex flex-col">
              <span class="text-xs font-bold text-white font-sans">Fragen vorlesen</span>
              <span class="text-[9px] text-white/40 leading-normal font-sans">Liest Frage-Texte im Spiel laut vor</span>
            </div>
            
            <!-- Custom Toggle Switch -->
            <button 
              (click)="toggleTts($event)" 
              class="relative inline-flex h-5 w-9 shrink-0 cursor-pointer rounded-full border-2 border-transparent transition-colors duration-200 ease-in-out focus:outline-none"
              [style.backgroundColor]="ttsEnabled() ? '#f1b814' : 'rgba(255, 255, 255, 0.1)'"
              [title]="ttsEnabled() ? 'Deaktivieren' : 'Aktivieren'">
              <span 
                class="pointer-events-none inline-block h-4 w-4 transform rounded-full bg-white shadow-md ring-0 transition duration-200 ease-in-out"
                [class.translate-x-4]="ttsEnabled()"
                [class.translate-x-0]="!ttsEnabled()">
              </span>
            </button>
          </div>

          <!-- TTS Status / Test Button (Shown only when TTS is active) -->
          @if (ttsEnabled()) {
            <div class="flex items-center justify-between gap-2 pt-2 border-t border-white/5">
              <div class="flex items-center gap-1.5 text-[9px] text-emerald-400 font-bold font-sans">
                <span class="flex h-1.5 w-1.5 relative">
                  <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
                  <span class="relative inline-flex rounded-full h-1.5 w-1.5 bg-emerald-400"></span>
                </span>
                <span>Bereit</span>
              </div>
              
              <!-- Voice Test Trigger -->
              <button 
                (click)="testVoice($event)"
                class="flex items-center gap-1 text-[9px] bg-jeopardy-gold/15 hover:bg-jeopardy-gold/25 text-jeopardy-gold border border-jeopardy-gold/30 rounded-lg px-2.5 py-1.5 font-bold uppercase tracking-wider transition-all duration-200 cursor-pointer outline-none">
                <svg class="w-2.5 h-2.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M19.114 5.636a9 9 0 010 12.728M16.463 8.288a5.25 5.25 0 010 7.424M6.75 8.25l4.72-4.72a.75.75 0 011.28.53v15.88a.75.75 0 01-1.28.53l-4.72-4.72H4.51c-.88 0-1.704-.507-1.938-1.354A9.01 9.01 0 012.25 12c0-.83.112-1.633.322-2.396C2.806 8.756 3.63 8.25 4.51 8.25H6.75z"></path>
                </svg>
                Stimme testen
              </button>
            </div>
          }
        </div>
      </div>

    </div>
  }
</div>

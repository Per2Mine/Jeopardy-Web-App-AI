<div
  [style.width.px]="pixelSize()"
  [style.height.px]="pixelSize()"
  class="avatar-stage relative flex items-center justify-center select-none"
  [class.avatar-mood-excited]="mood() === 'excited'"
  [class.avatar-mood-winner]="mood() === 'winner'"
>
  @if (parsedAvatar(); as av) {
    <svg
      viewBox="0 0 100 100"
      class="w-full h-full overflow-visible"
      role="img"
      [attr.aria-label]="name() ? 'Avatar von ' + name() : 'Spieler-Avatar'"
    >
      <defs>
        <!-- Volumetric 3D Clay Sphere Gradient -->
        <radialGradient [attr.id]="uid + '_body'" cx="36%" cy="28%" r="72%" fx="30%" fy="22%">
          <stop offset="0%" [attr.stop-color]="palette().highlight" />
          <stop offset="42%" [attr.stop-color]="palette().mid" />
          <stop offset="82%" [attr.stop-color]="palette().shadow" />
          <stop offset="100%" [attr.stop-color]="palette().deepShadow" />
        </radialGradient>

        <!-- Secondary Appendage 3D Gradient (ears, limbs, tail) -->
        <linearGradient [attr.id]="uid + '_limb'" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" [attr.stop-color]="palette().light" />
          <stop offset="55%" [attr.stop-color]="palette().mid" />
          <stop offset="100%" [attr.stop-color]="palette().deepShadow" />
        </linearGradient>

        <!-- Specular Gloss Overlay -->
        <linearGradient [attr.id]="uid + '_gloss'" x1="20%" y1="0%" x2="80%" y2="100%">
          <stop offset="0%" stop-color="#ffffff" stop-opacity="0.58" />
          <stop offset="50%" stop-color="#ffffff" stop-opacity="0.16" />
          <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
        </linearGradient>

        <!-- Bottom Bounce Rim Light -->
        <linearGradient [attr.id]="uid + '_rim'" x1="50%" y1="100%" x2="50%" y2="0%">
          <stop offset="0%" [attr.stop-color]="palette().rim" stop-opacity="0.45" />
          <stop offset="40%" [attr.stop-color]="palette().rim" stop-opacity="0" />
        </linearGradient>

        <!-- Ground Contact Shadow -->
        <radialGradient [attr.id]="uid + '_ground'" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="#020617" stop-opacity="0.62" />
          <stop offset="65%" stop-color="#020617" stop-opacity="0.22" />
          <stop offset="100%" stop-color="#020617" stop-opacity="0" />
        </radialGradient>

        <!-- Metallic 3D Gold (Crown / Stars) -->
        <linearGradient [attr.id]="uid + '_gold'" x1="15%" y1="0%" x2="85%" y2="100%">
          <stop offset="0%" stop-color="#fef08a" />
          <stop offset="45%" stop-color="#f59e0b" />
          <stop offset="100%" stop-color="#b45309" />
        </linearGradient>

        <!-- Soft 3D White / Cream (Penguin Belly, Mushroom Stem, Chef Hat) -->
        <radialGradient [attr.id]="uid + '_cream'" cx="38%" cy="28%" r="72%">
          <stop offset="0%" stop-color="#ffffff" />
          <stop offset="62%" stop-color="#f1f5f9" />
          <stop offset="100%" stop-color="#cbd5e1" />
        </radialGradient>

        <!-- Soft Inner Pink (Cat Ears / Blush) -->
        <linearGradient [attr.id]="uid + '_pink'" x1="20%" y1="0%" x2="80%" y2="100%">
          <stop offset="0%" stop-color="#fecdd3" />
          <stop offset="100%" stop-color="#fb7185" />
        </linearGradient>

        <!-- Soft 3D Cast Drop Shadow Filter -->
        <filter [attr.id]="uid + '_shadow'" x="-20%" y="-20%" width="140%" height="145%">
          <feDropShadow dx="0" dy="3" stdDeviation="2.4" flood-color="#020617" flood-opacity="0.38" />
        </filter>
      </defs>

      <!-- Single Unified Ground Contact Shadow -->
      <ellipse
        cx="50"
        cy="93"
        [attr.rx]="av.base === 3 ? 30 : 25"
        ry="5.5"
        [attr.fill]="'url(#' + uid + '_ground)'"
        [class.avatar-ground-shadow]="shouldAnimate() && av.base !== 5"
        [class.avatar-ground-shadow-ghost]="shouldAnimate() && av.base === 5"
      />

      <!-- Animated 3D Character Group -->
      <g
        [attr.filter]="'url(#' + uid + '_shadow)'"
        [class.avatar-body-breathe]="shouldAnimate() && av.base !== 5"
        [class.avatar-body-ghost]="shouldAnimate() && av.base === 5"
      >
        <!-- ================= BASE BODY SHAPES ================= -->
        @if (av.base === 0) {
          <!-- 0: 3D Clay Blob -->
          <ellipse cx="37" cy="90" rx="8.5" ry="4.5" [attr.fill]="palette().deepShadow" />
          <ellipse cx="63" cy="90" rx="8.5" ry="4.5" [attr.fill]="palette().deepShadow" />
          <path
            d="M 24 52 C 24 23, 76 23, 76 52 L 76 80 C 76 88, 69 92, 60 92 L 40 92 C 31 92, 24 88, 24 80 Z"
            [attr.fill]="'url(#' + uid + '_body)'"
            [attr.stroke]="palette().deepShadow"
            stroke-width="1.2"
          />
          <path
            d="M 26 52 C 26 26, 74 26, 74 52 L 74 80 C 74 86, 68 90, 60 90 L 40 90 C 32 90, 26 86, 26 80 Z"
            [attr.fill]="'url(#' + uid + '_rim)'"
          />
          <!-- Glossy 3D Highlight -->
          <ellipse cx="38" cy="36" rx="11" ry="6.5" [attr.fill]="'url(#' + uid + '_gloss)'" transform="rotate(-24,38,36)" />
          <circle cx="31" cy="43" r="2.2" fill="#ffffff" opacity="0.45" />
        } @else if (av.base === 1) {
          <!-- 1: 3D Retro Bot -->
          <!-- Legs -->
          <rect x="34" y="80" width="9" height="11" rx="3.5" fill="#1e293b" stroke="#0f172a" stroke-width="1.2" />
          <rect x="57" y="80" width="9" height="11" rx="3.5" fill="#1e293b" stroke="#0f172a" stroke-width="1.2" />
          <ellipse cx="38.5" cy="91" rx="7.5" ry="3.5" fill="#334155" stroke="#0f172a" stroke-width="1" />
          <ellipse cx="61.5" cy="91" rx="7.5" ry="3.5" fill="#334155" stroke="#0f172a" stroke-width="1" />
          <!-- Side Ear Bolts -->
          <rect x="19" y="45" width="7" height="15" rx="3.5" fill="#475569" stroke="#0f172a" stroke-width="1.2" />
          <rect x="74" y="45" width="7" height="15" rx="3.5" fill="#475569" stroke="#0f172a" stroke-width="1.2" />
          <!-- Antenna -->
          <line x1="50" y1="30" x2="50" y2="17" stroke="#94a3b8" stroke-width="4" stroke-linecap="round" />
          <g [class.avatar-antenna-pulse]="shouldAnimate()">
            <circle cx="50" cy="14" r="6" fill="#fb7185" opacity="0.32" />
            <circle cx="50" cy="14" r="4.5" fill="#f43f5e" stroke="#9f1239" stroke-width="1" />
            <circle cx="48.6" cy="12.6" r="1.4" fill="#ffffff" opacity="0.85" />
          </g>
          <!-- 3D Beveled Chassis -->
          <rect
            x="24" y="29" width="52" height="54" rx="13"
            [attr.fill]="'url(#' + uid + '_body)'"
            [attr.stroke]="palette().deepShadow"
            stroke-width="1.4"
          />
          <!-- Recessed Glass Visor Plate -->
          <rect x="30" y="37" width="40" height="34" rx="9" fill="rgba(15,23,42,0.16)" stroke="rgba(255,255,255,0.22)" stroke-width="1" />
          <!-- Top Chassis Gloss -->
          <path d="M 33 32 L 67 32 C 70 32, 72 34, 72 37 L 28 37 C 28 34, 30 32, 33 32 Z" [attr.fill]="'url(#' + uid + '_gloss)'" />
        } @else if (av.base === 2) {
          <!-- 2: 3D Kitty Cat -->
          <!-- Swaying Tail -->
          <g [class.avatar-tail-sway]="shouldAnimate()">
            <path
              d="M 72 76 Q 88 70 84 53"
              fill="none"
              [attr.stroke]="'url(#' + uid + '_limb)'"
              stroke-width="7.5"
              stroke-linecap="round"
            />
            <path d="M 73 74 Q 85 69 83 55" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="2" stroke-linecap="round" />
          </g>
          <!-- 3D Sculpted Cat Ears -->
          <path d="M 25 41 L 29 17 Q 31 14 35 17 L 48 32 Z" [attr.fill]="'url(#' + uid + '_limb)'" [attr.stroke]="palette().deepShadow" stroke-width="1.2" stroke-linejoin="round" />
          <path d="M 75 41 L 71 17 Q 69 14 65 17 L 52 32 Z" [attr.fill]="'url(#' + uid + '_limb)'" [attr.stroke]="palette().deepShadow" stroke-width="1.2" stroke-linejoin="round" />
          <path d="M 29 36 L 32 21 L 43 31 Z" [attr.fill]="'url(#' + uid + '_pink)'" />
          <path d="M 71 36 L 68 21 L 57 31 Z" [attr.fill]="'url(#' + uid + '_pink)'" />
          <!-- Paws -->
          <ellipse cx="37" cy="90" rx="8.5" ry="4.5" [attr.fill]="palette().deepShadow" />
          <ellipse cx="63" cy="90" rx="8.5" ry="4.5" [attr.fill]="palette().deepShadow" />
          <!-- Cat Body -->
          <path
            d="M 24 51 C 24 27, 76 27, 76 51 L 76 80 C 76 88, 69 92, 60 92 L 40 92 C 31 92, 24 88, 24 80 Z"
            [attr.fill]="'url(#' + uid + '_body)'"
            [attr.stroke]="palette().deepShadow"
            stroke-width="1.2"
          />
          <path d="M 26 51 C 26 29, 74 29, 74 51 L 74 80 C 74 86, 68 90, 60 90 L 40 90 C 32 90, 26 86, 26 80 Z" [attr.fill]="'url(#' + uid + '_rim)'" />
          <ellipse cx="38" cy="37" rx="10" ry="6" [attr.fill]="'url(#' + uid + '_gloss)'" transform="rotate(-20,38,37)" />
        } @else if (av.base === 3) {
          <!-- 3: 3D Chubby Octopus -->
          <g [class.avatar-tentacle-l]="shouldAnimate()">
            <path d="M 27 56 Q 11 67, 17 82" fill="none" [attr.stroke]="'url(#' + uid + '_limb)'" stroke-width="8.5" stroke-linecap="round" />
            <path d="M 35 62 Q 23 77, 29 90" fill="none" [attr.stroke]="'url(#' + uid + '_limb)'" stroke-width="7.5" stroke-linecap="round" />
            <path d="M 44 64 Q 38 80, 43 92" fill="none" [attr.stroke]="'url(#' + uid + '_limb)'" stroke-width="7.5" stroke-linecap="round" />
          </g>
          <g [class.avatar-tentacle-r]="shouldAnimate()">
            <path d="M 56 64 Q 62 80, 57 92" fill="none" [attr.stroke]="'url(#' + uid + '_limb)'" stroke-width="7.5" stroke-linecap="round" />
            <path d="M 65 62 Q 77 77, 71 90" fill="none" [attr.stroke]="'url(#' + uid + '_limb)'" stroke-width="7.5" stroke-linecap="round" />
            <path d="M 73 56 Q 89 67, 83 82" fill="none" [attr.stroke]="'url(#' + uid + '_limb)'" stroke-width="8.5" stroke-linecap="round" />
          </g>
          <!-- Glossy 3D Dome Head -->
          <ellipse
            cx="50" cy="45" rx="28" ry="26.5"
            [attr.fill]="'url(#' + uid + '_body)'"
            [attr.stroke]="palette().deepShadow"
            stroke-width="1.2"
          />
          <ellipse cx="50" cy="45" rx="26.5" ry="25" [attr.fill]="'url(#' + uid + '_rim)'" />
          <ellipse cx="38" cy="33" rx="13" ry="7.5" [attr.fill]="'url(#' + uid + '_gloss)'" transform="rotate(-24,38,33)" />
          <circle cx="30" cy="41" r="2.5" fill="#ffffff" opacity="0.45" />
        } @else if (av.base === 4) {
          <!-- 4: 3D Puffy Star -->
          <polygon
            points="50,10 61,35 88,38 68,57 73,83 50,69 27,83 32,57 12,38 39,35"
            [attr.fill]="'url(#' + uid + '_body)'"
            [attr.stroke]="palette().shadow"
            stroke-width="6.5"
            stroke-linejoin="round"
          />
          <polygon
            points="50,12 60,36 85,39 66,56 71,80 50,67 29,80 34,56 15,39 40,36"
            [attr.fill]="'url(#' + uid + '_body)'"
          />
          <ellipse cx="42" cy="31" rx="8.5" ry="5" [attr.fill]="'url(#' + uid + '_gloss)'" transform="rotate(-32,42,31)" />
        } @else if (av.base === 5) {
          <!-- 5: 3D Ethereal Floating Ghost -->
          <path
            d="M 26 50 C 26 23, 74 23, 74 50 L 74 79 Q 67 87, 62 77 Q 57 87, 50 79 Q 43 87, 38 77 Q 33 87, 26 79 Z"
            [attr.fill]="'url(#' + uid + '_body)'"
            [attr.stroke]="palette().deepShadow"
            stroke-width="1.1"
          />
          <path
            d="M 28 50 C 28 26, 72 26, 72 50 L 72 77 Q 66 84, 62 75 Q 57 84, 50 77 Q 43 84, 38 75 Q 34 84, 28 77 Z"
            [attr.fill]="'url(#' + uid + '_rim)'"
          />
          <ellipse cx="38" cy="36" rx="10" ry="6.5" [attr.fill]="'url(#' + uid + '_gloss)'" transform="rotate(-22,38,36)" />
        } @else if (av.base === 6) {
          <!-- 6: 3D Plump Mushroom -->
          <!-- Stem -->
          <rect x="38" y="54" width="24" height="33" rx="10" [attr.fill]="'url(#' + uid + '_cream)'" stroke="#94a3b8" stroke-width="1.2" />
          <!-- Cast Shadow from Cap onto Stem -->
          <ellipse cx="50" cy="60" rx="12" ry="4" fill="#0f172a" opacity="0.2" />
          <!-- 3D Mushroom Cap -->
          <ellipse
            cx="50" cy="44" rx="30" ry="23"
            [attr.fill]="'url(#' + uid + '_body)'"
            [attr.stroke]="palette().deepShadow"
            stroke-width="1.2"
          />
          <!-- Raised 3D Spots -->
          <circle cx="35" cy="38" r="5.2" fill="#ffffff" opacity="0.45" />
          <circle cx="59" cy="34" r="6.2" fill="#ffffff" opacity="0.4" />
          <circle cx="46" cy="27" r="3.6" fill="#ffffff" opacity="0.38" />
          <circle cx="68" cy="44" r="3.4" fill="#ffffff" opacity="0.32" />
          <ellipse cx="38" cy="31" rx="11" ry="6" [attr.fill]="'url(#' + uid + '_gloss)'" transform="rotate(-22,38,31)" />
        } @else if (av.base === 7) {
          <!-- 7: 3D Chubby Penguin -->
          <!-- Orange 3D Feet -->
          <ellipse cx="39" cy="91" rx="8" ry="3.8" fill="#f59e0b" stroke="#b45309" stroke-width="1" />
          <ellipse cx="61" cy="91" rx="8" ry="3.8" fill="#f59e0b" stroke="#b45309" stroke-width="1" />
          <!-- Animated Flippers -->
          <g [class.avatar-flipper-l]="shouldAnimate()">
            <path d="M 27 54 Q 17 65, 22 79" fill="none" [attr.stroke]="'url(#' + uid + '_limb)'" stroke-width="8" stroke-linecap="round" />
          </g>
          <g [class.avatar-flipper-r]="shouldAnimate()">
            <path d="M 73 54 Q 83 65, 78 79" fill="none" [attr.stroke]="'url(#' + uid + '_limb)'" stroke-width="8" stroke-linecap="round" />
          </g>
          <!-- Penguin Body -->
          <path
            d="M 26 48 C 26 24, 74 24, 74 48 L 74 80 C 74 88, 66 92, 57 92 L 43 92 C 34 92, 26 88, 26 80 Z"
            [attr.fill]="'url(#' + uid + '_body)'"
            [attr.stroke]="palette().deepShadow"
            stroke-width="1.2"
          />
          <!-- 3D Cream Belly -->
          <ellipse cx="50" cy="68" rx="17" ry="20.5" [attr.fill]="'url(#' + uid + '_cream)'" />
          <ellipse cx="38" cy="35" rx="9.5" ry="5.5" [attr.fill]="'url(#' + uid + '_gloss)'" transform="rotate(-22,38,35)" />
        }

        <!-- Soft 3D Cheek Glow -->
        <ellipse cx="32" cy="56" rx="4.8" ry="2.8" fill="#fb7185" opacity="0.26" />
        <ellipse cx="68" cy="56" rx="4.8" ry="2.8" fill="#fb7185" opacity="0.26" />

        <!-- ================= EYES SELECTION (with blink animation) ================= -->
        <g [class.avatar-eyes-blink]="canBlink()">
          @if (av.eyes === 0) {
            <!-- 0: Glossy 3D Friendly Dots -->
            <circle cx="41.5" cy="48" r="5" [attr.fill]="palette().featureInk" />
            <circle cx="58.5" cy="48" r="5" [attr.fill]="palette().featureInk" />
            <circle cx="43.3" cy="46.2" r="1.8" [attr.fill]="palette().eyeCatchlight" />
            <circle cx="60.3" cy="46.2" r="1.8" [attr.fill]="palette().eyeCatchlight" />
            <circle cx="40.2" cy="50.2" r="0.85" [attr.fill]="palette().eyeCatchlight" opacity="0.7" />
            <circle cx="57.2" cy="50.2" r="0.85" [attr.fill]="palette().eyeCatchlight" opacity="0.7" />
          } @else if (av.eyes === 1) {
            <!-- 1: Happy Curved (^^) -->
            <path d="M 36.5 50.5 Q 42 42.5 47.5 50.5" [attr.stroke]="palette().featureInk" stroke-width="3.8" stroke-linecap="round" fill="none" />
            <path d="M 52.5 50.5 Q 58 42.5 63.5 50.5" [attr.stroke]="palette().featureInk" stroke-width="3.8" stroke-linecap="round" fill="none" />
          } @else if (av.eyes === 2) {
            <!-- 2: 3D Tinted Cool Glasses -->
            <circle cx="41" cy="48" r="7.5" fill="rgba(15,23,42,0.35)" [attr.stroke]="palette().featureInk" stroke-width="3.2" />
            <circle cx="59" cy="48" r="7.5" fill="rgba(15,23,42,0.35)" [attr.stroke]="palette().featureInk" stroke-width="3.2" />
            <path d="M 37 45 L 42 43" stroke="#ffffff" stroke-width="1.6" stroke-linecap="round" opacity="0.65" />
            <path d="M 55 45 L 60 43" stroke="#ffffff" stroke-width="1.6" stroke-linecap="round" opacity="0.65" />
            <line x1="48.5" y1="48" x2="51.5" y2="48" [attr.stroke]="palette().featureInk" stroke-width="3.2" />
            <line x1="33.5" y1="48" x2="26" y2="46" [attr.stroke]="palette().featureInk" stroke-width="2.5" stroke-linecap="round" />
            <line x1="66.5" y1="48" x2="74" y2="46" [attr.stroke]="palette().featureInk" stroke-width="2.5" stroke-linecap="round" />
          } @else if (av.eyes === 3) {
            <!-- 3: Wink -->
            <circle cx="41.5" cy="48" r="5" [attr.fill]="palette().featureInk" />
            <circle cx="43.3" cy="46.2" r="1.8" [attr.fill]="palette().eyeCatchlight" />
            <path d="M 53.5 48.5 Q 58.5 53.5 63.5 48.5" [attr.stroke]="palette().featureInk" stroke-width="3.4" stroke-linecap="round" fill="none" />
          } @else if (av.eyes === 4) {
            <!-- 4: Sleepy / Chill -->
            <line x1="36.5" y1="48.5" x2="47" y2="48.5" [attr.stroke]="palette().featureInk" stroke-width="3.8" stroke-linecap="round" />
            <line x1="53" y1="48.5" x2="63.5" y2="48.5" [attr.stroke]="palette().featureInk" stroke-width="3.8" stroke-linecap="round" />
          } @else if (av.eyes === 5) {
            <!-- 5: Glowing Gold Star Eyes -->
            <path d="M 41.5 40.5 L 43.8 45 L 48.5 45.3 L 45 48.5 L 46 53.2 L 41.5 50.8 L 37 53.2 L 38 48.5 L 34.5 45.3 L 39.2 45 Z" [attr.fill]="'url(#' + uid + '_gold)'" stroke="#92400e" stroke-width="1" stroke-linejoin="round" />
            <path d="M 58.5 40.5 L 60.8 45 L 65.5 45.3 L 62 48.5 L 63 53.2 L 58.5 50.8 L 54 53.2 L 55 48.5 L 51.5 45.3 L 56.2 45 Z" [attr.fill]="'url(#' + uid + '_gold)'" stroke="#92400e" stroke-width="1" stroke-linejoin="round" />
          } @else if (av.eyes === 6) {
            <!-- 6: Wide Glossy Anime Eyes -->
            <ellipse cx="41" cy="47.5" rx="6.2" ry="8.2" [attr.fill]="palette().featureInk" />
            <ellipse cx="59" cy="47.5" rx="6.2" ry="8.2" [attr.fill]="palette().featureInk" />
            <circle cx="38.8" cy="44.2" r="2.7" [attr.fill]="palette().eyeCatchlight" />
            <circle cx="56.8" cy="44.2" r="2.7" [attr.fill]="palette().eyeCatchlight" />
            <circle cx="43.2" cy="50" r="1.3" [attr.fill]="palette().eyeCatchlight" />
            <circle cx="61.2" cy="50" r="1.3" [attr.fill]="palette().eyeCatchlight" />
          } @else if (av.eyes === 7) {
            <!-- 7: Angry / Focused -->
            <circle cx="41.5" cy="50.5" r="4.8" [attr.fill]="palette().featureInk" />
            <circle cx="58.5" cy="50.5" r="4.8" [attr.fill]="palette().featureInk" />
            <circle cx="43" cy="49" r="1.6" [attr.fill]="palette().eyeCatchlight" />
            <circle cx="60" cy="49" r="1.6" [attr.fill]="palette().eyeCatchlight" />
            <path d="M 34 43 L 47.5 47" [attr.stroke]="palette().featureInk" stroke-width="3.4" stroke-linecap="round" />
            <path d="M 66 43 L 52.5 47" [attr.stroke]="palette().featureInk" stroke-width="3.4" stroke-linecap="round" />
          } @else if (av.eyes === 8) {
            <!-- 8: UwU Eyes -->
            <path d="M 36.5 45 Q 36.5 53.5 42 53.5 Q 47.5 53.5 47.5 45" [attr.stroke]="palette().featureInk" stroke-width="3.2" stroke-linecap="round" fill="none" />
            <path d="M 52.5 45 Q 52.5 53.5 58 53.5 Q 63.5 53.5 63.5 45" [attr.stroke]="palette().featureInk" stroke-width="3.2" stroke-linecap="round" fill="none" />
          } @else if (av.eyes === 9) {
            <!-- 9: Glossy 3D Heart Eyes -->
            <path d="M 37 46 C 37 42.5, 41.5 41.5, 41.5 45 C 41.5 41.5, 46 42.5, 46 46 C 46 49.5, 41.5 53, 41.5 53 C 41.5 53, 37 49.5, 37 46 Z" fill="#ef4444" stroke="#991b1b" stroke-width="1.1" />
            <circle cx="39.5" cy="45" r="1.2" fill="#ffffff" opacity="0.7" />
            <path d="M 54 46 C 54 42.5, 58.5 41.5, 58.5 45 C 58.5 41.5, 63 42.5, 63 46 C 63 49.5, 58.5 53, 58.5 53 C 58.5 53, 54 49.5, 54 46 Z" fill="#ef4444" stroke="#991b1b" stroke-width="1.1" />
            <circle cx="56.5" cy="45" r="1.2" fill="#ffffff" opacity="0.7" />
          } @else if (av.eyes === 10) {
            <!-- 10: X / Cross Eyes -->
            <line x1="37" y1="44" x2="46.5" y2="52.5" [attr.stroke]="palette().featureInk" stroke-width="3.6" stroke-linecap="round" />
            <line x1="46.5" y1="44" x2="37" y2="52.5" [attr.stroke]="palette().featureInk" stroke-width="3.6" stroke-linecap="round" />
            <line x1="53.5" y1="44" x2="63" y2="52.5" [attr.stroke]="palette().featureInk" stroke-width="3.6" stroke-linecap="round" />
            <line x1="63" y1="44" x2="53.5" y2="52.5" [attr.stroke]="palette().featureInk" stroke-width="3.6" stroke-linecap="round" />
          } @else if (av.eyes === 11) {
            <!-- 11: Spiral Eyes -->
            <path d="M 41.5 48 C 41.5 44, 45.5 44, 45.5 48 C 45.5 51.5, 39.5 51.5, 39.5 47 C 39.5 43, 47.5 43, 47.5 48" [attr.stroke]="palette().featureInk" stroke-width="2.6" stroke-linecap="round" fill="none" />
            <path d="M 58.5 48 C 58.5 44, 62.5 44, 62.5 48 C 62.5 51.5, 56.5 51.5, 56.5 47 C 56.5 43, 64.5 43, 64.5 48" [attr.stroke]="palette().featureInk" stroke-width="2.6" stroke-linecap="round" fill="none" />
          }
        </g>

        <!-- ================= MOUTH SELECTION ================= -->
        @if (av.mouth === 0) {
          <!-- 0: Friendly Smile -->
          <path d="M 44.5 61 Q 50 67.5 55.5 61" [attr.stroke]="palette().featureInk" stroke-width="3.5" stroke-linecap="round" fill="none" />
        } @else if (av.mouth === 1) {
          <!-- 1: Open Joyful Smile -->
          <path d="M 42.5 59 Q 50 72 57.5 59 Z" fill="#881337" [attr.stroke]="palette().featureInk" stroke-width="2.6" stroke-linejoin="round" />
          <path d="M 45.5 65.5 Q 50 69 54.5 65.5" fill="#fb7185" />
        } @else if (av.mouth === 2) {
          <!-- 2: Sad / Frown -->
          <path d="M 44.5 66.5 Q 50 60 55.5 66.5" [attr.stroke]="palette().featureInk" stroke-width="3.5" stroke-linecap="round" fill="none" />
        } @else if (av.mouth === 3) {
          <!-- 3: Straight Cool Line -->
          <line x1="44.5" y1="63" x2="55.5" y2="63" [attr.stroke]="palette().featureInk" stroke-width="3.5" stroke-linecap="round" />
        } @else if (av.mouth === 4) {
          <!-- 4: Playful Tongue Out -->
          <line x1="43.5" y1="60" x2="56.5" y2="60" [attr.stroke]="palette().featureInk" stroke-width="3.5" stroke-linecap="round" />
          <path d="M 47.5 60 C 47.5 68, 52.5 68, 52.5 60 Z" fill="#fb7185" [attr.stroke]="palette().featureInk" stroke-width="2.2" />
          <line x1="50" y1="60" x2="50" y2="64.5" [attr.stroke]="palette().featureInk" stroke-width="1.4" />
        } @else if (av.mouth === 5) {
          <!-- 5: Surprised O-Mouth -->
          <ellipse cx="50" cy="63.5" rx="4.2" ry="5" fill="#881337" [attr.stroke]="palette().featureInk" stroke-width="2.4" />
        } @else if (av.mouth === 6) {
          <!-- 6: UwU / Cute w-mouth -->
          <path d="M 43 62 Q 46.5 67 50 62 Q 53.5 67 57 62" [attr.stroke]="palette().featureInk" stroke-width="3" stroke-linecap="round" fill="none" />
          <ellipse cx="34" cy="58" rx="4.5" ry="2.8" fill="#f472b6" opacity="0.55" />
          <ellipse cx="66" cy="58" rx="4.5" ry="2.8" fill="#f472b6" opacity="0.55" />
        } @else if (av.mouth === 7) {
          <!-- 7: Vampire Fangs -->
          <path d="M 42.5 59.5 Q 50 65.5 57.5 59.5" [attr.stroke]="palette().featureInk" stroke-width="3" stroke-linecap="round" fill="none" />
          <polygon points="44.5,60 47.2,60 45.8,66" fill="#ffffff" stroke="#94a3b8" stroke-width="0.8" />
          <polygon points="52.8,60 55.5,60 54.2,66" fill="#ffffff" stroke="#94a3b8" stroke-width="0.8" />
        } @else if (av.mouth === 8) {
          <!-- 8: Drool / Excited -->
          <path d="M 42.5 59.5 Q 50 68 57.5 59.5 Z" fill="#881337" [attr.stroke]="palette().featureInk" stroke-width="2.2" />
          <path d="M 53.5 64 Q 55 71, 52.5 73 Q 50 74.5, 51 70 Q 52 67, 53.5 64 Z" fill="#38bdf8" opacity="0.85" />
        } @else if (av.mouth === 9) {
          <!-- 9: Cat :3 Mouth + Whiskers -->
          <ellipse cx="50" cy="59.5" rx="2.3" ry="1.8" fill="#fb7185" />
          <path d="M 44 63 Q 47 67 50 63 Q 53 67 56 63" [attr.stroke]="palette().featureInk" stroke-width="2.6" stroke-linecap="round" fill="none" />
          <line x1="29" y1="55" x2="39" y2="58" [attr.stroke]="palette().featureSubtle" stroke-width="1.6" stroke-linecap="round" />
          <line x1="29" y1="62" x2="39" y2="61" [attr.stroke]="palette().featureSubtle" stroke-width="1.6" stroke-linecap="round" />
          <line x1="71" y1="55" x2="61" y2="58" [attr.stroke]="palette().featureSubtle" stroke-width="1.6" stroke-linecap="round" />
          <line x1="71" y1="62" x2="61" y2="61" [attr.stroke]="palette().featureSubtle" stroke-width="1.6" stroke-linecap="round" />
        }

        <!-- ================= 3D ACCESSORIES / HEADWEAR ================= -->
        @if (av.accessory === 1) {
          <!-- 1: 3D Metallic Royal Crown -->
          <ellipse cx="50" cy="28" rx="18" ry="3.2" fill="#0f172a" opacity="0.22" />
          <path
            d="M 32 28 L 36 13 L 44.5 21.5 L 50 10.5 L 55.5 21.5 L 64 13 L 68 28 Z"
            [attr.fill]="'url(#' + uid + '_gold)'"
            stroke="#92400e"
            stroke-width="1.6"
            stroke-linejoin="round"
          />
          <rect x="33.5" y="24.5" width="33" height="3.8" rx="1.8" fill="#b45309" />
          <circle cx="36" cy="12" r="2.7" fill="#ef4444" stroke="#991b1b" stroke-width="0.8" />
          <circle cx="50" cy="9.5" r="3" fill="#38bdf8" stroke="#0369a1" stroke-width="0.8" />
          <circle cx="64" cy="12" r="2.7" fill="#ef4444" stroke="#991b1b" stroke-width="0.8" />
          <circle cx="49" cy="8.5" r="0.9" fill="#ffffff" opacity="0.85" />
        } @else if (av.accessory === 2) {
          <!-- 2: 3D Party Hat -->
          <ellipse cx="50" cy="29" rx="16" ry="3" fill="#0f172a" opacity="0.22" />
          <polygon points="35,29 50,3 65,29" fill="#ec4899" stroke="#9d174d" stroke-width="1.4" stroke-linejoin="round" />
          <polygon points="37,28 50,5 54,28" fill="rgba(255,255,255,0.22)" />
          <path d="M 39 22 L 60 15" stroke="#38bdf8" stroke-width="2.6" stroke-linecap="round" />
          <path d="M 43 14 L 56 9" stroke="#4ade80" stroke-width="2.6" stroke-linecap="round" />
          <circle cx="50" cy="3" r="4.8" [attr.fill]="'url(#' + uid + '_gold)'" stroke="#b45309" stroke-width="1" />
          <circle cx="48.5" cy="1.8" r="1.4" fill="#ffffff" opacity="0.7" />
        } @else if (av.accessory === 3) {
          <!-- 3: 3D Classic Fedora -->
          <ellipse cx="50" cy="28" rx="28" ry="4.5" fill="#334155" stroke="#0f172a" stroke-width="1.6" />
          <path d="M 33 27 L 37 12 C 37 9.5, 63 9.5, 63 12 L 67 27 Z" fill="#1e293b" stroke="#0f172a" stroke-width="1.4" />
          <path d="M 38 13 C 42 11, 52 11, 54 13 L 52 24 L 36 24 Z" fill="rgba(255,255,255,0.12)" />
          <rect x="34.5" y="21.5" width="31" height="3.6" rx="1.2" fill="#ef4444" />
        } @else if (av.accessory === 4) {
          <!-- 4: 3D Pirate Captain Hat -->
          <path d="M 20 27 C 34 30, 66 30, 80 27 C 75 13, 62 11, 50 13 C 38 11, 25 13, 20 27 Z" fill="#1e293b" stroke="#0f172a" stroke-width="1.8" stroke-linejoin="round" />
          <path d="M 24 25 C 36 27, 64 27, 76 25" fill="none" stroke="#f59e0b" stroke-width="1.8" stroke-linecap="round" />
          <circle cx="50" cy="20" r="3.8" fill="#ffffff" />
          <circle cx="48.7" cy="19.6" r="0.9" fill="#0f172a" />
          <circle cx="51.3" cy="19.6" r="0.9" fill="#0f172a" />
        } @else if (av.accessory === 5) {
          <!-- 5: 3D Glossy Ribbon / Bow -->
          <path d="M 22 24 C 16 15, 29 14, 31 24 C 34 14, 46 15, 40 24 C 36 28, 26 28, 22 24 Z" fill="#ef4444" stroke="#991b1b" stroke-width="1.4" />
          <ellipse cx="26" cy="20" rx="3" ry="1.8" fill="#ffffff" opacity="0.35" transform="rotate(-20,26,20)" />
          <circle cx="31" cy="22" r="3.8" fill="#dc2626" stroke="#991b1b" stroke-width="1.2" />
          <circle cx="30" cy="21" r="1.1" fill="#ffffff" opacity="0.65" />
        } @else if (av.accessory === 6) {
          <!-- 6: 3D Puffy Chef Hat -->
          <ellipse cx="50" cy="29" rx="18" ry="3" fill="#0f172a" opacity="0.2" />
          <path
            d="M 33 29 L 33 23 C 33 23, 27 10, 40 10 C 44 10, 47 13, 50 9.5 C 53 13, 56 10, 60 10 C 73 10, 67 23, 67 23 L 67 29 Z"
            [attr.fill]="'url(#' + uid + '_cream)'"
            stroke="#94a3b8"
            stroke-width="1.6"
            stroke-linejoin="round"
          />
          <rect x="34.5" y="25.5" width="31" height="4.2" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1" rx="1.5" />
        } @else if (av.accessory === 7) {
          <!-- 7: Sculpted Gentleman Mustache -->
          <path
            d="M 36 60 C 40 54.5, 48 54.5, 50 58.2 C 52 54.5, 60 54.5, 64 60 C 67 62.5, 57 66, 50 61.5 C 43 66, 33 62.5, 36 60 Z"
            fill="#1e293b"
            stroke="#020617"
            stroke-width="1.4"
          />
          <path d="M 40 58.5 Q 44 56.8 48 58.5" fill="none" stroke="rgba(255,255,255,0.28)" stroke-width="1.1" stroke-linecap="round" />
        }
      </g>
    </svg>
  } @else {
    <!-- 3D Glossy Fallback Initials Sphere -->
    <div
      [style.background]="'radial-gradient(circle at 32% 28%, ' + palette().highlight + ', ' + palette().mid + ' 55%, ' + palette().shadow + ' 100%)'"
      class="w-full h-full rounded-full flex items-center justify-center font-black shadow-lg border border-white/20"
      [class.text-jeopardy-dark]="isGold()"
      [class.text-white]="!isGold()"
      [style.font-size.px]="pixelSize() * 0.4"
    >
      {{ initials() }}
    </div>
  }
</div>
